name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            output: ndns-linux-x64
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            output: ndns-macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            output: ndns-macos-x64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            output: ndns-windows-x64.exe
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: compile
        run: deno compile --target ${{ matrix.target }} --allow-net --allow-env --allow-read --allow-write -o dist/${{ matrix.output }} src/mod.ts
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.output }}
